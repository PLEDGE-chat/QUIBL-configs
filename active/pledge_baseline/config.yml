display_name: PLEDGE (baseline)
description: >
  Firearm safe storage guidance for adults. Baseline RAG pipeline: multi-query
  retrieval, OpenAI embeddings, by_title chunking. Other pledge_* configs each
  change one of these settings for comparison.
conversation_history_turns: 6
etl:
  partition_strategy: fast
  chunking_strategy: by_title
  max_characters: 1500
  overlap: 200
index:
  embedding_backend: openai
  embedding_model: text-embedding-3-small
  rag_top_k: 12
retrieval:
  strategy: multi_query
  rewrite_model: gpt-5.4-nano
  query_count: 4