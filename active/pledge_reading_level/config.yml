display_name: PLEDGE (3rd grade reading level)
description: >
  Same RAG pipeline and audience (parents/guardians) as pledge_baseline. Only
  the orchestration prompt differs: explicitly instructed to write at a 3rd
  grade reading level.
conversation_history_turns: 6
etl:
  partition_strategy: fast
  chunking_strategy: by_title
  max_characters: 1500
  overlap: 200
index:
  embedding_backend: openai
  embedding_model: text-embedding-3-small
  rag_top_k: 12
retrieval:
  strategy: multi_query
  rewrite_model: gpt-5.4-nano
  query_count: 4
